name: Release

# Publishes the tagged version to crates.io via OIDC trusted publishing —
# no long-lived API token involved. One-time setup on crates.io
# (crate page -> Settings -> Trusted Publishing -> Add GitHub Actions):
#   repository owner:  callbk
#   repository name:   finlight-client-rust
#   workflow filename: release.yml
#   environment:       rust
# Note: crates.io only allows configuring trusted publishing for an existing
# crate, so the very first version must be published manually with an API
# token (`cargo login` + `cargo publish`); every release after that goes
# through this workflow.

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: rust
    permissions:
      contents: read
      id-token: write # required for OIDC trusted publishing
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Check tag matches crate version
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          CRATE_VERSION="$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[0].version')"
          if [ "$VERSION" != "$CRATE_VERSION" ]; then
            echo "tag v${VERSION} does not match Cargo.toml version ${CRATE_VERSION}" >&2
            exit 1
          fi
      - name: Test
        run: cargo test
      - name: Authenticate with crates.io (trusted publishing)
        id: auth
        uses: rust-lang/crates-io-auth-action@v1
      - name: Publish to crates.io
        run: cargo publish
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
